<div class="cards">

      <div style="padding:14px;display:grid;gap:10px;background:#f8fafc;height:220px">
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">

          <div style="height:44px;background:white;border:1px solid #e5e7eb;border-radius:8px"></div>
          <div style="height:44px;background:white;border:1px solid #e5e7eb;border-radius:8px"></div>
        </div>
        <div style="height:44px;background:white;border:1px solid #e5e7eb;border-radius:8px"></div>
        <div style="background:white;border:2px solid #2563eb;border-radius:10px;padding:10px;display:grid;gap:8px">
          <div style="font-size:12px;font-weight:700;color:#1e293b">项目进度甘特图</div>
          <div style="display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center"><span style="font-size:10px;color:#64748b">设计评审</span><div style="height:14px;width:52%;background:#60a5fa;border-radius:999px"></div></div>

        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>A. 放在总览统计下面</h3>
      <p>推荐。打开“项目进度总揽”后先看整体数字，再看跨项目计划排期，符合驾驶舱页面逻辑。</p>
    </div>
  </div>

  <div class="card" data-choice="b" onclick="toggleSelect(this)">
    <div class="card-image">
      <div style="padding:14px;display:grid;gap:10px;background:#f8fafc;height:220px">
        <div style="background:white;border:2px solid #2563eb;border-radius:10px;padding:10px;display:grid;gap:8px;height:118px">

  </div>

  <div class="card" data-choice="c" onclick="toggleSelect(this)">

      <h3>C. 右侧并排小组件</h3>
      <p>占用空间少，但甘特图需要横向时间轴，小组件会压缩可读性，不适合任务多的项目。</p>
    </div>
  </div>
</div>
