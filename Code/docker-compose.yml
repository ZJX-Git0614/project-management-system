services:
  postgres:
    image: postgres:16-alpine
    container_name: pms-postgres
    environment:
      - POSTGRES_USER=pms
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured in .env}
      - POSTGRES_DB=pms
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms -d pms"]
      interval: 5s
      timeout: 5s
      retries: 5

  pms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pms
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://pms:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured in .env}@postgres:5432/pms?schema=public
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be configured in .env}
      - PROJECT_DOCUMENT_STORAGE_DIR=/app/.local-runtime/project-documents
      - SYSTEM_BACKUP_DIR=/app/.local-runtime/system-backups
      - PROJECT_MPP_EXPORT_SERVICE_URL=${PROJECT_MPP_EXPORT_SERVICE_URL:-}
      - PROJECT_MPP_EXPORT_SERVICE_HEALTH_URL=${PROJECT_MPP_EXPORT_SERVICE_HEALTH_URL:-}
      - PROJECT_MPP_EXPORT_SERVICE_TOKEN=${PROJECT_MPP_EXPORT_SERVICE_TOKEN:-}
      - PMS_WEB_WORKERS=${PMS_WEB_WORKERS:-4}
      - ASSISTANT_MODEL_BASE_URL=${ASSISTANT_MODEL_BASE_URL:-}
      - ASSISTANT_MODEL=${ASSISTANT_MODEL:-}
      - ASSISTANT_MODEL_API_KEY=${ASSISTANT_MODEL_API_KEY:-}
      - ASSISTANT_CONFIG_ENCRYPTION_KEY=${ASSISTANT_CONFIG_ENCRYPTION_KEY:?ASSISTANT_CONFIG_ENCRYPTION_KEY must be configured in .env}
      - ASSISTANT_SERVICE_MANAGER_URL=${ASSISTANT_SERVICE_MANAGER_URL:-}
      - ASSISTANT_SERVICE_MANAGER_TOKEN=${ASSISTANT_SERVICE_MANAGER_TOKEN:-}
      - RAGLITE_SERVICE_URL=${RAGLITE_SERVICE_URL:-}
      - RAGLITE_SERVICE_TOKEN=${RAGLITE_SERVICE_TOKEN:-}
      - NODE_ENV=production
    volumes:
      - document_storage:/app/.local-runtime/project-documents
      - ./backups:/app/.local-runtime/system-backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  document_storage:
