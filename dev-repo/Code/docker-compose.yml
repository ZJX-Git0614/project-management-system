version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pms-postgres
    environment:
      - POSTGRES_USER=pms
      - POSTGRES_PASSWORD=pms-pwd-2026
      - POSTGRES_DB=pms
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms -d pms"]
      interval: 5s
      timeout: 5s
      retries: 5

  pms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pms
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://pms:pms-pwd-2026@postgres:5432/pms?schema=public
      - JWT_SECRET=pms-production-jwt-secret-2026
      - PROJECT_DOCUMENT_STORAGE_DIR=/app/.local-runtime/project-documents
      - ASSISTANT_MODEL_BASE_URL=${ASSISTANT_MODEL_BASE_URL:-}
      - ASSISTANT_MODEL=${ASSISTANT_MODEL:-}
      - ASSISTANT_MODEL_API_KEY=${ASSISTANT_MODEL_API_KEY:-}
      - ASSISTANT_CONFIG_ENCRYPTION_KEY=${ASSISTANT_CONFIG_ENCRYPTION_KEY:-pms-local-assistant-encryption-key-change-in-production}
      - RAGLITE_SERVICE_URL=${RAGLITE_SERVICE_URL:-}
      - RAGLITE_SERVICE_TOKEN=${RAGLITE_SERVICE_TOKEN:-}
      - NODE_ENV=production
    volumes:
      - document_storage:/app/.local-runtime/project-documents
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  document_storage:
